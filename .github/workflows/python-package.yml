# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    #- name: Set up Python ${{ matrix.python-version }}
    #  uses: actions/setup-python@v2
    #  with:
    #    python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip python3-setuptools \
            debhelper devscripts gir1.2-gtk-3.0 gir1.2-poppler-0.18 \
            libgirepository1.0-dev libcairo2-dev pkg-config
        python3 -m pip install --upgrade pip
        python3 -m pip install pikepdf PyGObject flake8 pytest

    - name: Syntax check (Smoke Test)
      run: |
        python3 -m py_compile pdfbooklet/pdfbooklet3.py pdfbooklet/files_chooser.py pdfbooklet/pdfarranger_embed.py
        
    - name: Lint with flake8
      run: |
        # Basic linting to catch critical errors, ignoring the bundled pdfarranger
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=pdfbooklet/pdfarranger
    - name: Create package
      run: |
        python3 package_deb.py
        
    - name: Upload Debian Package
      uses: actions/upload-artifact@v4
      with:
        name: pdfbooklet-deb
        path: builds/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up MSYS2 with GTK3
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip
          mingw-w64-x86_64-gtk3
          mingw-w64-x86_64-python-gobject
          mingw-w64-x86_64-qpdf
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-python-lxml
          
    - name: Install pip dependencies
      shell: msys2 {0}
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller pikepdf pytest flake8
        
    - name: Syntax check
      shell: msys2 {0}
      run: |
        python -m py_compile pdfbooklet/pdfbooklet3.py pdfbooklet/files_chooser.py pdfbooklet/pdfarranger_embed.py
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=pdfbooklet/pdfarranger
        
    - name: Build Windows Executable with PyInstaller
      shell: msys2 {0}
      run: |
        pyinstaller windows_pkg.spec
        
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PdfBooklet-Windows
        path: dist/PdfBooklet
